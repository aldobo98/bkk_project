
[agent]
  interval = "10s"
  flush_interval = "1s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://broker.hivemq.com:1883"]
  topics = ["test/bkk/#"]
  qos = 0
  client_id = "telegraf-iot"
  data_format = "json"

  # Azonosítók címkeként
  tag_keys = [
    "vehicle_id",
    "trip_id",
    "route_id",
    "stop_id"
  ]

  # A timestamp_utc mező legyen a mérés időpontja
  json_time_key = "timestamp_utc"
  json_time_format = "2006-01-02 15:04:05"
  json_timezone = "UTC"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "iot"
  bucket = "measurements"
