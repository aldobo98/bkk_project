[agent]
  interval = "10s"
  flush_interval = "1s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://broker.hivemq.com:1883"]
  topics = ["bkk/forgalom/adatok/ooM0goo7AC9aeh9ha4ahPhu5E"]
  qos = 0
  client_id = "telegraf-iot"

  # Beérkező üzenetek formátuma: nyers CSV sorok
  data_format = "csv"

  # Mivel minden üzenet csak 1 sor adat, nincs bennük fejléc
  csv_header_row_count = 0

  # FIGYELEM: Az oszlopoknak PONTOSAN ebben a sorrendben kell jönniük a CSV sorban!
  csv_column_names = [
    "timestamp_utc",
    "vehicle_id",
    "trip_id",
    "route_id",
    "lat",
    "lon",
    "speed",
    "heading",
    "vehicle_timestamp",
    "stop_id",
    "current_stop_sequence",
    "delay_seconds"
  ]

  # Azonosítók (Indexelt InfluxDB Tag-ek)
  # A többi oszlop (lat, lon, speed, delay_seconds stb.) automatikusan Field (mért érték) lesz!
  csv_tag_columns = [
    "vehicle_id",
    "trip_id",
    "route_id",
    "stop_id"
  ]

  # Időbélyeg beállítása (ugyanaz, amit JSON-nél szerettél volna)
  csv_timestamp_column = "timestamp_utc"
  csv_timestamp_format = "2006-01-02 15:04:05"
  csv_timezone = "UTC"

  # Az InfluxDB tábla (measurement) neve
  name_override = "bkk_forgalom"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "iot"
  bucket = "measurements"
